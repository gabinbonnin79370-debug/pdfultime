<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFULTIME - Outils PDF en ligne & Accès Illimité</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left { display: flex; align-items: center; gap: 1.5rem; }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .logo-svg { width: 40px; height: 40px; }
    .logo-text { font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.03em; }
    .logo-text span {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-badge {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    
    .btn-nav {
      background-color: var(--primary);
      color: white !important;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-nav:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    .hero { text-align: center; padding: 5rem 1rem 3rem 1rem; max-width: 900px; margin: 0 auto; }
    .hero h1 {
      font-size: 3.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a3b1c6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1.5rem; max-width: 750px; margin-left: auto; margin-right: auto; }

    .compatibility-tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
    .tag {
      background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(37, 99, 235, 0.3);
      color: #93c5fd; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
    }

    .trial-banner {
      display: inline-flex; align-items: center; gap: 0.75rem;
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
      border: 1px solid var(--card-border); padding: 0.75rem 1.5rem; border-radius: 30px; font-size: 1rem; font-weight: 600; color: #fff;
    }
    .trial-banner span { color: var(--accent); font-weight: 700; }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }

    .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 6rem; }
    .tool-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 2.5rem 2rem;
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .tool-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
    .tool-card h3 { font-size: 1.4rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
    .tool-card p { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; height: 3rem; }

    .file-input-group { display: flex; flex-direction: column; gap: 1.25rem; }
    input[type="file"], input[type="text"] {
      background: var(--bg); border: 1px solid var(--card-border); color: var(--text);
      padding: 0.85rem; border-radius: 10px; width: 100%;
    }
    input[type="file"] { cursor: pointer; }

    .btn-action {
      background-color: var(--primary); color: white; border: none; padding: 0.85rem 1.5rem;
      border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-action:hover { background-color: var(--primary-hover); }

    .pricing-section { padding-top: 4rem; border-top: 1px solid var(--card-border); }
    .pricing-header { text-align: center; margin-bottom: 4rem; }
    .pricing-header h2 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.75rem; }

    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 2rem; align-items: start; }
    .pricing-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 3rem 2rem 2.5rem 2rem;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.3s;
    }
    .pricing-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px -15px rgba(0,0,0,0.6); }
    .pricing-card.popular { border: 2px solid var(--primary); background: linear-gradient(180deg, rgba(37, 99, 235, 0.08) 0%, var(--card-bg) 100%); }

    .badge {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%); color: white; padding: 6px 20px;
      font-size: 0.8rem; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .pricing-card h3 { font-size: 1.6rem; margin-bottom: 0.75rem; }
    .price { font-size: 3rem; font-weight: 800; color: #ffffff; margin: 1.5rem 0; letter-spacing: -0.02em; }

    .features { list-style: none; margin: 2rem 0 3rem 0; }
    .features li { padding: 0.75rem 0; color: var(--text); display: flex; align-items: center; gap: 0.85rem; font-size: 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .icon-check { color: var(--accent); font-weight: bold; font-size: 1.1rem; }
    .icon-cross { color: var(--danger); font-weight: bold; font-size: 1.1rem; }
    .disabled-feature { color: var(--text-muted); opacity: 0.7; }

    .btn-buy {
      display: block; text-align: center; background-color: var(--primary); color: white; text-decoration: none;
      padding: 1rem 1.5rem; border-radius: 12px; font-weight: 700; font-size: 1.1rem; transition: background-color 0.2s, transform 0.1s; cursor: pointer; border: none; width: 100%;
    }
    .btn-buy:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    .btn-buy.secondary { background-color: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-buy.secondary:hover { background-color: rgba(255, 255, 255, 0.05); border-color: var(--text-muted); }

    /* MODALE DE FIN D'ESSAIS */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px;
      padding: 2.5rem; max-width: 450px; width: 90%; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); transform: translateY(20px); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-card { transform: translateY(0); }
    .modal-icon { font-size: 3rem; margin-bottom: 1rem; }
    .modal-card h3 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.75rem; color: #fff; }
    .modal-card p { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
    .modal-buttons { display: flex; flex-direction: column; gap: 0.75rem; }

    footer { text-align: center; padding: 4rem 1rem; color: var(--text-muted); border-top: 1px solid var(--card-border); margin-top: 6rem; font-size: 0.95rem; }
  </style>
</head>
<body>

  <!-- POPUP MODALE -->
  <div id="trialModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">⚡</div>
      <h3>Essais gratuits épuisés !</h3>
      <p>Vous avez utilisé vos 3 essais gratuits. Choisissez un pass pour continuer à manipuler vos PDF en illimité.</p>
      <div class="modal-buttons">
        <button onclick="closeModalAndScroll()" class="btn-action">Voir les Pass & Tarifs</button>
        <button onclick="closeModal()" class="btn-buy secondary" style="padding: 0.85rem;">Fermer</button>
      </div>
    </div>
  </div>

  <nav>
    <div class="nav-left">
      <a href="#" class="logo-container">
