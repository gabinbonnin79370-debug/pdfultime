<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFUltime - Fusionnez et compressez vos PDF en un clic</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #0f172a;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        input[type="email"], input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #actionSection {
            display: none;
            margin-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
        }
        .status-badge {
            background-color: #eff6ff;
            color: #1e40af;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>PDFUltime</h1>
        <p class="subtitle">La solution rapide pour vos documents</p>

        <!-- Étape 1 : Saisie de l'e-mail -->
        <div id="emailSection" class="form-group">
            <label for="userEmail">Entrez votre e-mail pour commencer :</label>
            <input type="email" id="userEmail" placeholder="votre@email.com" required>
            <div style="margin-top: 1rem;">
                <button type="button" id="verifyEmailBtn">Valider et tester</button>
            </div>
        </div>

        <!-- Étape 2 : Zone de fusion (cachée tant que l'email n'est pas validé) -->
        <div id="actionSection">
            <div id="statusInfo" class="status-badge"></div>

            <form id="pdfForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="pdfFiles">Sélectionnez vos fichiers PDF :</label>
                    <input type="file" id="pdfFiles" name="pdfs" multiple accept=".pdf" required>
                </div>
                <button type="submit" id="submitBtn">Fusionner les PDF</button>
            </form>
        </div>
    </div>

    <script>
        let userEmailValid = "";

        // 1. Validation de l'e-mail et récupération du statut
        document.getElementById('verifyEmailBtn').addEventListener('click', async () => {
            const emailInput = document.getElementById('userEmail').value.trim();
            if (!emailInput || !emailInput.includes('@')) {
                alert("Veuillez entrer une adresse e-mail valide.");
                return;
            }

            try {
                const response = await fetch('/api/auth/register-trial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                const data = await response.json();

                if (response.ok) {
                    userEmailValid = emailInput;
                    document.getElementById('emailSection').style.display = 'none';
                    document.getElementById('actionSection').style.display = 'block';

                    const statusInfo = document.getElementById('statusInfo');
                    if (data.trialsRemaining > 0) {
                        statusInfo.innerText = `Il vous reste ${data.trialsRemaining} essai(s) gratuit(s).`;
                    } else {
                        statusInfo.innerText = "Vous avez épuisé vos 5 essais gratuits !";
                        triggerPaywall();
                    }
                } else {
                    alert(data.error || "Erreur lors de la validation.");
                }
            } catch (err) {
                console.error("Erreur technique :", err);
                alert("Erreur de connexion au serveur.");
            }
        });

        // 2. Soumission des fichiers pour la fusion
        document.getElementById('pdfForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userEmailValid) {
                alert("Veuillez d'abord valider votre e-mail.");
                return;
            }

            const fileInput = document.getElementById('pdfFiles');
            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner au moins un fichier PDF.");
                return;
            }

            const formData = new FormData();
            formData.append('email', userEmailValid);
            for (let file of fileInput.files) {
                formData.append('pdfs', file);
            }

            try {
                const response = await fetch('/api/merge', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    // Recharge la page ou met à jour l'interface après succès
                    location.reload();
                } else {
                    alert(result.error);
                    if (response.status === 403) {
                        triggerPaywall();
                    }
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Une erreur est survenue lors de l'envoi.");
            }
        });

        // 3. Redirection automatique vers la page de paiement Stripe
        function triggerPaywall() {
            const goToPremium = confirm("Vous avez atteint votre limite de 5 essais gratuits.\n\nVoulez-vous débloquer l'accès illimité pour seulement 2,99 € ?");
            if (goToPremium) {
                window.location.href = '/premium';
            }
        }
    </script>
</body>
</html>
