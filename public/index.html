<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFUltime - Outils PDF Rapides & Sécurisés</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .hero-badge {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 520px;
            box-sizing: border-box;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
            text-align: center;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="email"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fcfcfc;
        }

        input[type="email"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #fff;
        }

        /* Style stylisé pour le champ fichier */
        .file-drop-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .file-drop-area:hover {
            border-color: var(--primary);
            background-color: #f0f4ff;
        }

        input[type="file"] {
            display: none;
        }

        .file-label-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #actionSection {
            display: none;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .status-badge {
            background-color: #eff6ff;
            color: #1e40af;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.25rem;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }

        .features-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="hero-badge">⚡ Ultra-rapide & Sécurisé</div>

    <div class="card">
        <h1>PDFUltime</h1>
        <p class="subtitle">Fusionnez et compressez vos fichiers en un clin d'œil</p>

        <!-- Étape 1 : Saisie de l'e-mail -->
        <div id="emailSection" class="form-group">
            <label for="userEmail">Entrez votre e-mail pour accéder aux outils :</label>
            <input type="email" id="userEmail" placeholder="votre@email.com" required>
            <div style="margin-top: 1.25rem;">
                <button type="button" id="verifyEmailBtn">Débloquer mes essais gratuits</button>
            </div>
        </div>

        <!-- Étape 2 : Zone de travail (cachée par défaut) -->
        <div id="actionSection">
            <div id="statusInfo" class="status-badge"></div>

            <form id="pdfForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Sélectionnez vos documents PDF :</label>
                    <label for="pdfFiles" class="file-drop-area" id="dropArea">
                        <span class="file-label-text" id="fileNameDisplay">📂 Glissez vos fichiers ici ou cliquez pour parcourir</span>
                    </label>
                    <input type="file" id="pdfFiles" name="pdfs" multiple accept=".pdf" required>
                </div>
                <button type="submit" id="submitBtn">Lancer la fusion</button>
            </form>
        </div>
    </div>

    <div class="features-footer">
        Paiement sécurisé par Stripe • Sans engagement • Fichiers supprimés automatiquement
    </div>

    <script>
        let userEmailValid = "";

        // Afficher le nom du fichier sélectionné
        const fileInput = document.getElementById('pdfFiles');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameDisplay.innerText = `${fileInput.files.length} fichier(s) sélectionné(s)`;
                fileNameDisplay.style.color = "#2563eb";
                fileNameDisplay.style.fontWeight = "600";
            }
        });

        // 1. Validation de l'e-mail
        document.getElementById('verifyEmailBtn').addEventListener('click', async () => {
            const emailInput = document.getElementById('userEmail').value.trim();
            if (!emailInput || !emailInput.includes('@')) {
                alert("Veuillez entrer une adresse e-mail valide.");
                return;
            }

            try {
                const response = await fetch('/api/auth/register-trial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                const data = await response.json();

                if (response.ok) {
                    userEmailValid = emailInput;
                    document.getElementById('emailSection').style.display = 'none';
                    document.getElementById('actionSection').style.display = 'block';

                    const statusInfo = document.getElementById('statusInfo');
                    if (data.trialsRemaining > 0) {
                        statusInfo.innerText = `✨ Il vous reste ${data.trialsRemaining} essai(s) gratuit(s).`;
                    } else {
                        statusInfo.innerText = "⚠️ Vous avez épuisé vos 5 essais gratuits !";
                        triggerPaywall();
                    }
                } else {
                    alert(data.error || "Erreur lors de la validation.");
                }
            } catch (err) {
                console.error("Erreur technique :", err);
                alert("Erreur de connexion au serveur.");
            }
        });

        // 2. Soumission des fichiers
        document.getElementById('pdfForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userEmailValid) {
                alert("Veuillez d'abord valider votre e-mail.");
                return;
            }

            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner au moins un fichier PDF.");
                return;
            }

            const formData = new FormData();
            formData.append('email', userEmailValid);
            for (let file of fileInput.files) {
                formData.append('pdfs', file);
            }

            try {
                const response = await fetch('/api/merge', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    location.reload();
                } else {
                    alert(result.error);
                    if (response.status === 403) {
                        triggerPaywall();
                    }
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Une erreur est survenue lors de l'envoi.");
            }
        });

        // 3. Redirection vers Stripe
        function triggerPaywall() {
            const goToPremium = confirm("Vous avez atteint votre limite de 5 essais gratuits.\n\nVoulez-vous débloquer l'accès illimité pour seulement 2,99 € ?");
            if (goToPremium) {
                window.location.href = '/premium';
            }
        }
    </script>
</body>
</html>
